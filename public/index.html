<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hostel DBMS — Admin Panel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Hostel Accommodation &amp; Student Services</h1>
    <p>Database Admin Panel — Insert, View &amp; Delete Records</p>
  </header>

  <div class="layout">
    <nav id="tableNav" class="sidebar">
      <!-- table buttons injected by app.js -->
    </nav>

    <main class="content">
      <section class="panel">
        <h2 id="formTitle">Add New Record</h2>
        <div id="statusMsg" class="status-msg"></div>
        <form id="recordForm" class="record-form">
          <!-- form fields injected by app.js -->
          <button type="submit" class="btn btn-primary">Insert Record</button>
        </form>
      </section>

      <section class="panel">
        <h2 id="tableTitle">Existing Records</h2>
        <div class="table-wrap">
          <table id="dataTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
